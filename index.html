  :root {
    --bg: #0B0E16;
    --lamp: #E7B364;
    --lamp-dim: #7A5E33;
    --slate: #8C93A6;
    --text: #EDEAE2;
    --text-dim: #B7B4AC;
    --hairline: #242A3A;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    min-height: 100vh;
  }

  body {
    font-family: 'Noto Sans TC', sans-serif;
  }

  button { font-family: inherit; }
  button:hover { opacity: 0.85; }

  .screen {
    position: relative;
    min-height: 100vh;
    overflow: hidden;
  }

  #detail-screen.screen {
    height: 100vh;
    min-height: 0;
    flex-direction: column;
  }

  .detail-container {
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  .detail-header {
    flex-shrink: 0;
  }

  .lyrics-scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 48px;
  }

  .lamp {
    position: absolute;
    border-radius: 50%;
    filter: blur(2px);
    animation: breathe 5s ease-in-out infinite;
    pointer-events: none;
    left: 50%;
    background: radial-gradient(circle, var(--lamp)55 0%, var(--lamp)22 35%, transparent 70%);
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.6; transform: translateX(-50%) scale(1); }
    50% { opacity: 1; transform: translateX(-50%) scale(1.08); }
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
  }

  .container.wide {
    max-width: 620px;
  }

  .category-bar {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 28px;
    position: relative;
  }

  .hamburger-btn {
    background: transparent;
    border: 1px solid var(--hairline);
    border-radius: 6px;
    padding: 10px 12px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 4px;
    justify-content: center;
  }

  .hamburger-btn span {
    width: 18px;
    height: 2px;
    background: var(--text-dim);
    display: block;
    border-radius: 1px;
  }

  .current-category {
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 13px;
    letter-spacing: 0.08em;
    color: var(--lamp);
  }

  .category-dropdown {
    position: absolute;
    top: 100%;
    left: 0;
    margin-top: 8px;
    background: #121628;
    border: 1px solid var(--hairline);
    border-radius: 8px;
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 150px;
    z-index: 20;
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
  }

  .category-dropdown.hidden {
    display: none;
  }

  .category-btn {
    background: transparent;
    border: none;
    text-align: left;
    padding: 10px 12px;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 14px;
    color: var(--text-dim);
    cursor: pointer;
    border-radius: 6px;
    width: 100%;
  }

  .category-btn.active {
    color: var(--lamp);
    background: rgba(231, 179, 100, 0.1);
  }

  /* ---- Home screen ---- */
  #home-screen { padding: 48px 24px 64px; }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.25em;
    color: var(--lamp);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  h1 {
    font-family: 'Noto Serif TC', serif;
    font-weight: 600;
    font-size: 32px;
    color: var(--text);
    margin: 0 0 6px;
  }

  .subtitle {
    font-size: 13px;
    color: var(--text-dim);
    margin: 0 0 40px;
    line-height: 1.7;
  }

  .song-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .song-item {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--hairline);
    padding: 20px 4px;
    cursor: pointer;
  }

    border-top: 1px solid var(--hairline);
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--lamp);
    box-shadow: 0 0 10px 2px rgba(231, 179, 100, 0.53);
    flex-shrink: 0;

  .song-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 19px;
    font-weight: 500;
    color: var(--text);
  }

  .play-hint {
    margin-left: auto;
    font-size: 12px;
    color: var(--slate);
  }

  .footnote {
    margin-top: 40px;
    font-size: 12px;
    color: var(--slate);
    line-height: 1.8;
  }

  .pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    row-gap: 10px;
    margin-top: 32px;
    flex-wrap: wrap;

  .page-btn {
    background: transparent;
    border: 1px solid var(--hairline);
    color: var(--text-dim);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 13px;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
  }

  .page-btn:disabled {
    opacity: 0.3;
    cursor: default;
  }

  .page-btn:disabled:hover {
    opacity: 0.3;
  }

  .page-indicator {
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 12px;
    color: var(--lamp);
    letter-spacing: 0.1em;
  }

  /* ---- Detail screen ---- */

  .back-btn {
    background: transparent;
    border: none;
    color: var(--slate);
    font-size: 13px;
    letter-spacing: 0.05em;
    cursor: pointer;
    padding: 8px 0 28px;
    display: flex;
    align-items: center;
    gap: 6px;

  .detail-title {
    font-family: 'Noto Serif TC', serif;
    font-weight: 700;
    font-size: 30px;
    color: var(--text);
    margin: 0 0 24px;
    text-align: center;

  .player-wrap {
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--hairline);
    margin-bottom: 16px;
  }

  .player-wrap iframe {
    display: block;
    border: none;
    width: 100%;
    height: 80px;
  }

  .track-nav {

    justify-content: space-between;
    gap: 12px;
    margin-bottom: 36px;
  }

  .track-nav .page-btn {
    flex: 1;
    text-align: center;
  }

  .divider {

    align-items: center;
    gap: 12px;
    margin: 0 0 24px;
  }

  .divider .line {
    flex: 1;
    height: 1px;
    background: var(--hairline);

  .divider .label {
    font-size: 12px;
    letter-spacing: 0.2em;

  .lyrics {

    flex-direction: column;

  }

  .section-tag {
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--lamp-dim);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

    font-size: 16px;

    color: var(--text-dim);

  const homeScreen = document.getElementById("home-screen");
  const detailScreen = document.getElementById("detail-screen");
  const songListEl = document.getElementById("song-list");
  const paginationEl = document.getElementById("pagination");
  const categoryListEl = document.getElementById("category-list");
  const hamburgerBtn = document.getElementById("hamburger-btn");
  const currentCategoryLabel = document.getElementById("current-category-label");
  const detailTitleEl = document.getElementById("detail-title");
  const playerFrame = document.getElementById("player-frame");
  const lyricsEl = document.getElementById("lyrics");
  const lyricsDividerEl = document.getElementById("lyrics-divider");
  const backBtn = document.getElementById("back-btn");
  const prevTrackBtn = document.getElementById("prev-track-btn");
  const nextTrackBtn = document.getElementById("next-track-btn");

  const CATEGORIES = ["其他", "Z-ONE", "純音樂"];
  const SONGS_PER_PAGE = 8;
  let currentPage = 1;
  let currentCategory = CATEGORIES[0];

  function getFilteredSongs() {
    const filtered = songs.filter(s => s.category === currentCategory);
    if (currentCategory === "純音樂") {
      filtered.sort((a, b) => a.title.localeCompare(b.title, "en", { numeric: true, sensitivity: "base" }));
    }
    return filtered;
  }

  function renderCategories() {
    categoryListEl.innerHTML = "";
    CATEGORIES.forEach(cat => {
      const btn = document.createElement("button");
      btn.className = "category-btn" + (cat === currentCategory ? " active" : "");
      btn.textContent = cat;
      btn.addEventListener("click", () => {
        if (currentCategory !== cat) {
          currentCategory = cat;
          currentPage = 1;
          renderCategories();
          renderSongList();
        }
        categoryListEl.classList.add("hidden");
      });
      categoryListEl.appendChild(btn);
    });
    currentCategoryLabel.textContent = currentCategory;
  }

  hamburgerBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    categoryListEl.classList.toggle("hidden");
  });

  document.addEventListener("click", (e) => {
    if (!categoryListEl.contains(e.target) && e.target !== hamburgerBtn) {
      categoryListEl.classList.add("hidden");
    }
  });

  let currentPlaylist = [];
  let currentPlaylistIndex = -1;

  function renderSongList() {
    songListEl.innerHTML = "";
    const filtered = getFilteredSongs();
    currentPlaylist = filtered;
    const totalPages = Math.max(1, Math.ceil(filtered.length / SONGS_PER_PAGE));
    if (currentPage > totalPages) currentPage = totalPages;

    const start = (currentPage - 1) * SONGS_PER_PAGE;
    const pageSongs = filtered.slice(start, start + SONGS_PER_PAGE);

    if (pageSongs.length === 0) {
      const empty = document.createElement("p");
      empty.className = "footnote";
      empty.style.marginTop = "0";
      empty.textContent = "這個類別還沒有歌曲。";
      songListEl.appendChild(empty);
    }

    pageSongs.forEach((song) => {
      const playlistIndex = filtered.indexOf(song);
      const btn = document.createElement("button");
      btn.className = "song-item";
      btn.innerHTML = `
        <span class="dot"></span>
        <span class="song-title">${song.title}</span>
        <span class="play-hint">播放 →</span>
      `;
      btn.addEventListener("click", () => openSong(playlistIndex));
      songListEl.appendChild(btn);
    });

    renderPagination(totalPages);
  }

  function renderPagination(totalPages) {
    paginationEl.innerHTML = "";
    if (totalPages <= 1) return;

    const firstBtn = document.createElement("button");
    firstBtn.className = "page-btn";
    firstBtn.textContent = "⏮ 首頁";
    firstBtn.disabled = currentPage === 1;
    firstBtn.addEventListener("click", () => {
      if (currentPage !== 1) {
        currentPage = 1;
        renderSongList();
      }
    });

    const prevBtn = document.createElement("button");
    prevBtn.className = "page-btn";
    prevBtn.textContent = "← 上一頁";
    prevBtn.disabled = currentPage === 1;
    prevBtn.addEventListener("click", () => {
      if (currentPage > 1) {
        currentPage -= 1;
        renderSongList();
      }
    });

    const indicator = document.createElement("span");
    indicator.className = "page-indicator";
    indicator.textContent = `${currentPage} / ${totalPages}`;

    const nextBtn = document.createElement("button");
    nextBtn.className = "page-btn";
    nextBtn.textContent = "下一頁 →";
    nextBtn.disabled = currentPage === totalPages;
    nextBtn.addEventListener("click", () => {
      if (currentPage < totalPages) {
        currentPage += 1;
        renderSongList();
      }
    });

    const lastBtn = document.createElement("button");
    lastBtn.className = "page-btn";
    lastBtn.textContent = "末頁 ⏭";
    lastBtn.disabled = currentPage === totalPages;
    lastBtn.addEventListener("click", () => {
      if (currentPage !== totalPages) {
        currentPage = totalPages;
        renderSongList();
      }
    });

    paginationEl.appendChild(firstBtn);
    paginationEl.appendChild(prevBtn);
    paginationEl.appendChild(indicator);
    paginationEl.appendChild(nextBtn);
    paginationEl.appendChild(lastBtn);
  }

  function openSong(playlistIndex) {
    currentPlaylistIndex = playlistIndex;
    const song = currentPlaylist[playlistIndex];
    detailTitleEl.textContent = song.title;
    playerFrame.src = `https://drive.google.com/file/d/${song.driveId}/preview`;

    lyricsEl.innerHTML = "";
    const hasLyrics = Array.isArray(song.sections) && song.sections.length > 0;

    if (!hasLyrics) {
      lyricsDividerEl.style.display = "none";
      const note = document.createElement("p");
      note.className = "lyric-line";
      note.style.textAlign = "center";
      note.style.color = "var(--slate)";
      note.style.marginTop = "12px";
      note.textContent = "這是一首純音樂，沒有歌詞。";
      lyricsEl.appendChild(note);
    } else {
      lyricsDividerEl.style.display = "flex";
      song.sections.forEach(sec => {
        const block = document.createElement("div");
        if (sec.tag) {
          const tag = document.createElement("div");
          tag.className = "section-tag";
          tag.textContent = `[${sec.tag}]`;
          block.appendChild(tag);
        }

        sec.lines.forEach(line => {
          if (line === "") {
            const gap = document.createElement("div");
            gap.className = "lyric-gap";
            block.appendChild(gap);
          } else {
            const p = document.createElement("p");
            p.className = "lyric-line";
            p.textContent = line;
            block.appendChild(p);
          }
        });
        lyricsEl.appendChild(block);
      });
    }

    renderTrackNav();

    homeScreen.style.display = "none";
    detailScreen.style.display = "flex";
    window.scrollTo(0, 0);
  }

  function renderTrackNav() {
    prevTrackBtn.disabled = currentPlaylistIndex <= 0;
    nextTrackBtn.disabled = currentPlaylistIndex >= currentPlaylist.length - 1;
  }

  prevTrackBtn.addEventListener("click", () => {
    if (currentPlaylistIndex > 0) {
      openSong(currentPlaylistIndex - 1);
    }
  });

  nextTrackBtn.addEventListener("click", () => {
    if (currentPlaylistIndex < currentPlaylist.length - 1) {
      openSong(currentPlaylistIndex + 1);
    }
  });

  backBtn.addEventListener("click", () => {
    playerFrame.src = "";
    detailScreen.style.display = "none";
    homeScreen.style.display = "block";
    window.scrollTo(0, 0);
  });

  renderCategories();
  renderSongList();
</script>
